<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIK-GAMER Portal</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color: #5865F2; font-size: 3rem; margin-bottom: 5px; }
        p { color: #8a8f98; margin-bottom: 40px; font-size: 1.1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .game-btn {
            background-color: #1a1a24;
            padding: 25px 15px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #2d2d3d;
            cursor: pointer;
            text-transform: capitalize;
            transition: all 0.2s ease;
        }
        .game-btn:hover {
            border-color: #5865F2;
            background-color: #232332;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }
        #status-msg {
            color: #ff9f43;
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>EPIK-GAMER ARCADE</h1>
    <p>Automatically scanning root directories for verified index launch points...</p>

    <div id="status-msg">Scanning folders for entry points...</div>
    <div class="grid" id="game-grid"></div>

    <script>
        // CONFIGURATION: Set your GitHub profile and repository identity
        const GITHUB_USER = 'andrewprice101';
        const REPO_NAME = 'web-port_v2';

        // Root folders we want to completely skip checking
        const IGNORED_FOLDERS = ['.github', '.git'];

        async function verifyAndLoadGames() {
            const grid = document.getElementById('game-grid');
            const status = document.getElementById('status-msg');
            
            try {
                // Step 1: Call the GitHub API to fetch the contents of the main root directory
                const rootResponse = await fetch(`https://github.com{GITHUB_USER}/${REPO_NAME}/contents/`);
                if (!rootResponse.ok) throw new Error('Failed to fetch repository root contents');
                
                const rootItems = await rootResponse.json();
                let verifiedGamesCount = 0;

                // Step 2: Loop through every item found in the root directory
                for (const item of rootItems) {
                    if (item.type === 'dir' && !IGNORED_FOLDERS.includes(item.name)) {
                        
                        // Step 3: Check inside the folder to see if an index.html exists
                        try {
                            const folderResponse = await fetch(`https://github.com{GITHUB_USER}/${REPO_NAME}/contents/${item.name}`);
                            if (folderResponse.ok) {
                                const folderContents = await folderResponse.json();
                                
                                // Look for an exact match for index.html inside this specific folder
                                const hasIndex = folderContents.some(file => file.name.toLowerCase() === 'index.html');
                                
                                if (hasIndex) {
                                    // Step 4: Create the button if verified
                                    const button = document.createElement('button');
                                    button.className = 'game-btn';
                                    
                                    // Set the button text to the folder name (replacing hyphens with clean spaces)
                                    button.innerText = item.name.replace(/-/g, ' ');
                                    
                                    // Route the click event to open the folder's index inside the cloaked view
                                    button.onclick = () => launchStealthTab(`./${item.name}/index.html`);
                                    
                                    grid.appendChild(button);
                                    verifiedGamesCount++;
                                }
                            }
                        } catch (folderErr) {
                            console.warn(`Could not read contents of folder: ${item.name}`, folderErr);
                        }
                    }
                }

                // Update or hide the status message based on findings
                if (verifiedGamesCount === 0) {
                    status.innerText = 'No valid game folders with index.html files found.';
                } else {
                    status.style.display = 'none';
                }

            } catch (err) {
                status.innerText = 'System error scanning directories. Please refresh the page.';
                status.style.color = '#ff3e3e';
                console.error(err);
            }
        }

        function launchStealthTab(targetPath) {
            // Open a fresh, completely blank instance tab
            var blankWindow = window.open('about:blank', '_blank');
            
            if (blankWindow) {
                var doc = blankWindow.document;
                var iframe = doc.createElement('iframe');
                
                // Resolve the absolute URL string for the embedded target
                var absoluteUrl = new URL(targetPath, window.location.href).href;
                
                iframe.src = absoluteUrl;
                iframe.style.position = 'fixed';
                iframe.style.top = '0';
                iframe.style.left = '0';
                iframe.style.width = '100vw';
                iframe.style.height = '100vh';
                iframe.style.border = 'none';
                iframe.style.margin = '0';
                iframe.style.padding = '0';
                iframe.style.overflow = 'hidden';
                
                doc.body.style.margin = '0';
                doc.body.style.padding = '0';
                doc.body.style.overflow = 'hidden';
                
                doc.body.appendChild(iframe);
            } else {
                alert('Pop-up blocked! Please grant popup permissions to allow the cloaked canvas to load.');
            }
        }

        // Initialize the repository content evaluation on page arrival
        window.onload = verifyAndLoadGames;
    </script>

</body>
</html>
