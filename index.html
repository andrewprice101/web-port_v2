<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIK-GAMER Portal</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color: #5865F2; font-size: 3rem; margin-bottom: 5px; }
        p { color: #8a8f98; margin-bottom: 40px; font-size: 1.1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .game-btn {
            background-color: #1a1a24;
            padding: 25px 15px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #2d2d3d;
            cursor: pointer;
            text-transform: capitalize;
            transition: all 0.2s ease;
        }
        .game-btn:hover {
            border-color: #5865F2;
            background-color: #232332;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }
        #status-msg {
            color: #ff9f43;
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>EPIK-GAMER ARCADE</h1>
    <p>Deep scanning repository tree for entry files...</p>

    <div id="status-msg">Scanning full repository map...</div>
    <div class="grid" id="game-grid"></div>

    <script>
        // CONFIGURATION: Map to your specific profile and repository names
        const GITHUB_USER = 'andrewprice101';
        const REPO_NAME = 'web-port_v2';
        const TARGET_BRANCH = 'main'; // Change to 'master' if your repo uses it

        async function deeplyScanRepository() {
            const grid = document.getElementById('game-grid');
            const status = document.getElementById('status-msg');
            
            try {
                // Single high-efficiency call requesting the full recursive file layout
                const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/git/trees/${TARGET_BRANCH}?recursive=1`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error('API limit reached or directory restricted');
                
                const data = await response.json();
                status.style.display = 'none'; // Clear out the loading notice
                
                let buttonCreated = false;

                // Examine every element returned across the entire repository tree structure
                data.tree.forEach(item => {
                    // Look for items that end with index.html but ignore your primary dashboard index.html
                    if (item.path.toLowerCase().endsWith('index.html') && item.path.toLowerCase() !== 'index.html') {
                        
                        // Extract the folder location name by dropping the trailing /index.html
                        const folderPath = item.path.substring(0, item.path.toLowerCase().lastIndexOf('/index.html'));
                        
                        // If the index file is hidden deeper inside nested subfolders, grab just the last directory name
                        const displayTitle = folderPath.includes('/') ? folderPath.split('/').pop() : folderPath;
                        
                        const button = document.createElement('button');
                        button.className = 'game-btn';
                        
                        // Clean up formatting for visual display (e.g. omori-fixed -> omori fixed)
                        button.innerText = displayTitle.replace(/-/g, ' ');
                        
                        // Onclick launches the exact path relative to your hosted layout inside the frame
                        button.onclick = () => launchStealthTab(`./${item.path}`);
                        
                        grid.appendChild(button);
                        buttonCreated = true;
                    }
                });

                if (!buttonCreated) {
                    status.innerText = 'No internal index.html files located inside your game subfolders.';
                    status.style.display = 'block';
                }

            } catch (err) {
                status.innerText = 'Unable to compile arcade map. Try refreshing shortly.';
                status.style.color = '#ff3e3e';
                console.error(err);
            }
        }

        function launchStealthTab(targetPath) {
            var blankWindow = window.open('about:blank', '_blank');
            
            if (blankWindow) {
                var doc = blankWindow.document;
                var iframe = doc.createElement('iframe');
                
                var absoluteUrl = new URL(targetPath, window.location.href).href;
                
                iframe.src = absoluteUrl;
                iframe.style.position = 'fixed';
                iframe.style.top = '0';
                iframe.style.left = '0';
                iframe.style.width = '100vw';
                iframe.style.height = '100vh';
                iframe.style.border = 'none';
                iframe.style.margin = '0';
                iframe.style.padding = '0';
                iframe.style.overflow = 'hidden';
                
                doc.body.style.margin = '0';
                doc.body.style.padding = '0';
                doc.body.style.overflow = 'hidden';
                
                doc.body.appendChild(iframe);
            } else {
                alert('Pop-up window blocked! Enable standard popups to run the cloaked frame components.');
            }
        }

        window.onload = deeplyScanRepository;
    </script>

</body>
</html>
