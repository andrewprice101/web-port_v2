<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIK-GAMER Portal</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { color: #5865F2; font-size: 3rem; margin-bottom: 5px; }
        p { color: #8a8f98; margin-bottom: 40px; font-size: 1.1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .game-btn {
            background-color: #1a1a24;
            padding: 25px 15px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #2d2d3d;
            cursor: pointer;
            text-transform: capitalize;
            transition: all 0.2s ease;
        }
        .game-btn:hover {
            border-color: #5865F2;
            background-color: #232332;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }
    </style>
</head>
<body>

    <h1>EPIK-GAMER ARCADE</h1>
    <p>Select a game to launch it instantly inside a cloaked tab</p>

    <div class="grid" id="game-grid"></div>

    <script>
        // MASTER GAME LIST: Enter the exact folder names from your repository here
        const GAME_FOLDERS = [
            "amanda-the-adventurer",
            "andys-apple-farm",
            "baldi-plus",
            "baldi-remaster",
            "bendy",
            "bergentruck",
            "bloodmoney",
            "buckshot-roulette",
            "cuphead",
            "five-nights-at-freddys",
            "geometry-dash",
            "get-away-shootout",
            "gun-mayhem",
            "iron-snout",
            "minecraft",
            "omori-fixed",
            "pizza-tower",
            "retro-bowl",
            "roblox",
            "slope",
            "subway-surfers",
            "thats-not-my-neighbor",
            "tunnel-rush",
            "ultrakill",
            "undertale-yellow",
            "vex-7"
        ];

        function generateGameButtons() {
            const grid = document.getElementById('game-grid');
            
            GAME_FOLDERS.forEach(folder => {
                const button = document.createElement('button');
                button.className = 'game-btn';
                
                // Cleans up the folder name text for the button layout (e.g. pizza-tower -> pizza tower)
                button.innerText = folder.replace(/-/g, ' ');
                
                // On click, it explicitly points to the folder's index file inside the about:blank frame
                button.onclick = () => launchStealthTab(`./${folder}/index.html`);
                
                grid.appendChild(button);
            });
        }

        function launchStealthTab(targetPath) {
            var blankWindow = window.open('about:blank', '_blank');
            
            if (blankWindow) {
                var doc = blankWindow.document;
                var iframe = doc.createElement('iframe');
                
                var absoluteUrl = new URL(targetPath, window.location.href).href;
                
                iframe.src = absoluteUrl;
                iframe.style.position = 'fixed';
                iframe.style.top = '0';
                iframe.style.left = '0';
                iframe.style.width = '100vw';
                iframe.style.height = '100vh';
                iframe.style.border = 'none';
                iframe.style.margin = '0';
                iframe.style.padding = '0';
                iframe.style.overflow = 'hidden';
                
                doc.body.style.margin = '0';
                doc.body.style.padding = '0';
                doc.body.style.overflow = 'hidden';
                
                doc.body.appendChild(iframe);
            } else {
                alert('Pop-up blocked! Please grant popup permissions to allow the cloaked layout to run.');
            }
        }

        // Initialize the layout builder immediately
        window.onload = generateGameButtons;
    </script>

</body>
</html>
